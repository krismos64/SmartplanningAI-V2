# ==============================================
# SMARTPLANNING - PIPELINE CI (Continuous Integration)
# ==============================================
#
# CI = Intégration Continue. À chaque push ou PR, ce pipeline :
# 1. Vérifie la qualité du code (lint, types)
# 2. Lance les tests unitaires (Vitest)
# 3. Lance les tests E2E (Playwright) - sur PR vers main OU push direct sur main
# 4. Vérifie que le build fonctionne
#
# STRATÉGIE D'OPTIMISATION (SP-113) :
# ┌─────────────────────────────────────────────────────────────────┐
# │ Scénario              │ Unit Tests │ E2E Tests │ Temps estimé  │
# ├─────────────────────────────────────────────────────────────────┤
# │ Push feature branch   │     ✅     │    ❌     │   ~3-5 min    │
# │ PR vers main          │     ✅     │    ✅     │   ~8-10 min   │
# │ Push direct main      │     ✅     │    ✅     │   ~8-10 min   │
# └─────────────────────────────────────────────────────────────────┘
#
# POURQUOI E2E SUR PUSH DIRECT MAIN ?
# - Sécurité : même sans PR, les tests E2E valident le code avant déploiement
# - Le CD (déploiement) attend que le CI complet réussisse
# - Garantit qu'aucun code non testé n'arrive en production
#
# STRATÉGIE NAVIGATEURS E2E :
# - CI : Chromium uniquement (stabilité, ~65% des utilisateurs)
# - Local : Chromium + Firefox + WebKit (tests complets)
# - Justification : WebKit/Firefox sur Linux CI sont instables
#
# @ticket SP-113, SP-134

name: CI - Lint, Test & Build

# ----------------------------------------------
# DÉCLENCHEURS (Quand le workflow s'exécute)
# ----------------------------------------------
on:
  push:
    branches:
      - '**' # Tous les push sur toutes les branches
  pull_request:
    branches:
      - main # PR vers main uniquement (déclenche les tests E2E)

# ----------------------------------------------
# PERMISSIONS
# ----------------------------------------------
# Par sécurité, on limite les permissions au minimum
permissions:
  contents: read

# ----------------------------------------------
# VARIABLES D'ENVIRONNEMENT GLOBALES
# ----------------------------------------------
env:
  NODE_VERSION: '20'

# ----------------------------------------------
# JOBS (Tâches à exécuter)
# ----------------------------------------------
jobs:
  # ============================================
  # JOB 1 : LINT & TYPE-CHECK
  # ============================================
  # Vérifie la syntaxe et les types TypeScript
  # Exécuté sur TOUS les push et PR
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

  # ============================================
  # JOB 2 : TESTS UNITAIRES
  # ============================================
  # Exécute les tests Vitest avec couverture
  # Exécuté sur TOUS les push et PR
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: 'file:./test.db'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # JOB 3 : TESTS E2E (Critical - Optimisé)
  # ============================================
  # OPTIMISATION SP-333 : Tests critiques uniquement (~180 tests)
  # - Réduit le temps de 40min à ~10-12min
  # - Suite complète exécutée chaque nuit (nightly-e2e.yml)
  #
  # Exécuté sur :
  # - Pull Request vers main (validation avant merge)
  # - Push direct sur main (sécurité avant déploiement)
  #
  # Tests inclus : smoke, auth, RBAC, CRUD, schedules, leaves
  # Tests exclus : mobile, navigation, analytics, a11y (nightly)
  test-e2e:
    name: E2E Tests (Critical)
    runs-on: ubuntu-latest
    needs: lint
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Timeout réduit grâce à l'optimisation
    timeout-minutes: 25

    # Service container PostgreSQL pour les tests E2E
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartplanning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smartplanning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Installe uniquement Chromium (optimisation CI)
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Setup database environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/smartplanning_test" > .env
          echo "NEXTAUTH_SECRET=test-secret-for-ci" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "✅ PostgreSQL is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 1
          done

      - name: Test database connection
        run: |
          echo "🔌 Testing database connection..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT version();"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      - name: Apply database migrations
        run: |
          echo "🔄 Applying Prisma migrations to test database..."
          npx prisma migrate deploy
          echo "📋 Listing tables after migration..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT tablename FROM pg_tables WHERE schemaname = 'public';"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      - name: Seed test database
        run: |
          echo "🌱 Seeding test database..."
          npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      - name: Verify test users exist
        run: |
          echo "🔍 Checking test users..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT email, role FROM users LIMIT 5;"
          USER_COUNT=$(npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT COUNT(*) FROM users;" 2>/dev/null || echo "0")
          echo "📊 User count: $USER_COUNT"
          if [ "$USER_COUNT" = "0" ]; then
            echo "❌ ERROR: No users found in database. E2E tests will fail."
            exit 1
          fi
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      # Build l'application pour utiliser le mode production (plus stable)
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      # Lance les tests E2E critiques avec config optimisée
      - name: Run E2E tests (Critical subset)
        run: npx playwright test --config=playwright.ci.config.ts
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

      # Upload du rapport Playwright (même en cas d'échec)
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Upload des screenshots/traces en cas d'échec
      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 4 : BUILD
  # ============================================
  # Vérifie que l'application peut être buildée
  # Exécuté sur TOUS les push et PR
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://fake:fake@localhost:5432/fake'
          NEXTAUTH_SECRET: 'build-secret'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            !.next/cache/
          retention-days: 1

# ==============================================
# RÉSUMÉ DU PIPELINE CI OPTIMISÉ (SP-333)
# ==============================================
#
# STRATÉGIE E2E OPTIMISÉE :
# - CI : Tests critiques uniquement (~180 tests, ~10-12 min)
# - Nightly : Suite complète (~500 tests, chaque nuit à 2h00 UTC)
#
# FLUX D'EXÉCUTION (Push sur feature branch) :
#
#                    ┌──────────────────┐
#                    │       LINT       │
#                    └────────┬─────────┘
#                             │
#                             ▼
#                    ┌────────────────┐
#                    │  TEST (Unit)   │
#                    └────────┬───────┘
#                             │
#                             ▼
#                    ┌─────────────────┐
#                    │      BUILD      │
#                    └─────────────────┘
#                    ~5 min | E2E: non
#
# FLUX D'EXÉCUTION (PR vers main OU Push direct main) :
#
#                    ┌──────────────────┐
#                    │       LINT       │
#                    └────────┬─────────┘
#                             │
#              ┌──────────────┴──────────────┐
#              ▼                             ▼
#     ┌────────────────┐          ┌─────────────────────┐
#     │  TEST (Unit)   │          │  TEST-E2E           │
#     │   (Vitest)     │          │  (Critical only)    │
#     └────────┬───────┘          └─────────────────────┘
#              │                           │
#              ▼                           │
#     ┌─────────────────┐                  │
#     │      BUILD      │ ◄────────────────┘
#     └─────────────────┘   (E2E doit réussir)
#                    ~10-12 min | E2E: oui
#
# TESTS CI (playwright.ci.config.ts) :
# - smoke, auth, middleware-rbac, forbidden
# - dashboard/rbac-protection
# - crud/employees, teams, companies
# - schedules, leaves/navigation, leaves/create-request
# - profile/profile-display
#
# TESTS NIGHTLY (playwright.nightly.config.ts) :
# - Tous les tests E2E (~500 tests)
# - Exécuté chaque nuit à 2h00 UTC
# - Workflow : nightly-e2e.yml
#
# SÉCURITÉ DU DÉPLOIEMENT :
# - Le CD ne se déclenche que si le CI complet réussit
# - Les tests E2E critiques sont obligatoires sur main
# - Suite complète nightly détecte les régressions
# ==============================================
