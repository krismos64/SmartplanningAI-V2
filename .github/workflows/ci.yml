# ==============================================
# SMARTPLANNING - PIPELINE CI (Continuous Integration)
# ==============================================

# CI = Intégration Continue. À chaque push ou PR, ce pipeline :
# 1. Vérifie la qualité du code (lint, types)
# 2. Lance les tests unitaires (Vitest)
# 3. Lance les tests E2E (Playwright)
# 4. Vérifie que le build fonctionne
#
# OBJECTIF : Détecter les erreurs AVANT de merger sur main
# Si une étape échoue, la PR ne peut pas être mergée.
#
# DÉCLENCHEURS :
# - Push sur n'importe quelle branche
# - Pull Request vers main
#
# @ticket SP-134

name: CI - Lint, Test & Build

# ----------------------------------------------
# DÉCLENCHEURS (Quand le workflow s'exécute)
# ----------------------------------------------
# "on" définit les événements qui déclenchent le workflow
# - push : à chaque commit poussé
# - pull_request : à chaque PR ouverte/mise à jour
on:
  push:
    branches:
      - '**' # Toutes les branches
  pull_request:
    branches:
      - main
      - develop

# ----------------------------------------------
# PERMISSIONS
# ----------------------------------------------
# Par sécurité, on limite les permissions au minimum.
# contents: read = lecture seule du code source
permissions:
  contents: read

# ----------------------------------------------
# VARIABLES D'ENVIRONNEMENT GLOBALES
# ----------------------------------------------
# Ces variables sont accessibles dans tous les jobs
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

# ----------------------------------------------
# JOBS (Tâches à exécuter)
# ----------------------------------------------
jobs:
  # ============================================
  # JOB 1 : LINT & TYPE-CHECK
  # ============================================
  # Vérifie la syntaxe et les types TypeScript
  # C'est la première ligne de défense contre les erreurs
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # ubuntu-latest = machine virtuelle Linux fournie par GitHub
    # C'est gratuit pour les repos publics (2000 min/mois pour privés)

    steps:
      # checkout = récupérer le code source du repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js avec cache npm pour accélérer
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Le cache stocke node_modules entre les runs
          # Gain de temps : ~1-2 minutes par run

      # npm ci = installation propre des dépendances
      # Contrairement à "npm install", ci :
      # - Supprime node_modules existant
      # - Installe exactement les versions du package-lock.json
      # - Plus rapide et plus fiable en CI
      - name: Install dependencies
        run: npm ci

      # ESLint vérifie les règles de code (syntaxe, bonnes pratiques)
      - name: Run ESLint
        run: npm run lint

      # TypeScript vérifie les types sans transpiler
      # Détecte les erreurs de typage avant le runtime
      - name: Run Type Check
        run: npm run type-check

  # ============================================
  # JOB 2 : TESTS UNITAIRES
  # ============================================
  # Exécute les tests Jest/Vitest
  # Les tests valident que le code fonctionne comme prévu
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    # "needs: lint" = ce job attend que lint soit terminé
    # Si lint échoue, les tests ne sont pas lancés (gain de temps)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Génère le Prisma Client nécessaire pour les tests
      - name: Generate Prisma Client
        run: npx prisma generate

      # Lance les tests unitaires avec Vitest et couverture
      # La couverture indique quel % du code est testé
      - name: Run unit tests with coverage
        run: npm run test:coverage
        env:
          # Variables nécessaires pour les tests
          DATABASE_URL: 'file:./test.db'
          NEXTAUTH_SECRET: 'test-secret-for-ci'
          NEXTAUTH_URL: 'http://localhost:3000'

      # Upload du rapport de couverture
      # Visible dans l'onglet "Actions" de GitHub
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # JOB 3 : TESTS E2E (Playwright)
  # ============================================
  # Exécute les tests End-to-End avec Playwright
  # Teste l'application dans 3 navigateurs : Chromium, Firefox, WebKit
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    # "needs: lint" = ce job attend que lint soit terminé
    # Les tests E2E peuvent s'exécuter en parallèle avec les tests unitaires
    timeout-minutes: 60
    # Timeout de 60 minutes pour les tests E2E (plus longs que les unitaires)

    # Service container PostgreSQL pour les tests E2E
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartplanning_test
        ports:
          - 5432:5432
        # Health checks avec le bon utilisateur
        options: >-
          --health-cmd "pg_isready -U test -d smartplanning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Génère le Prisma Client nécessaire pour l'application
      - name: Generate Prisma Client
        run: npx prisma generate

      # Installe les navigateurs Playwright avec leurs dépendances système
      # --with-deps installe aussi les librairies système requises (fonts, etc.)
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Crée le fichier .env pour que Prisma utilise la bonne DB
      - name: Setup database environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/smartplanning_test" > .env
          echo "NEXTAUTH_SECRET=test-secret-for-ci" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
          cat .env
          echo "✅ .env file created"

      # Vérifie la connexion à la DB
      - name: Test database connection
        run: |
          echo "🔌 Testing database connection..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT version();"
          echo "✅ Database connection OK"

      # Test: créer une table manuellement pour vérifier la connexion
      - name: Debug - Create test table manually
        run: |
          echo "🔧 Creating test table manually..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "CREATE TABLE IF NOT EXISTS _test_table (id SERIAL PRIMARY KEY, name TEXT);"
          echo "📋 Checking if test table exists..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT tablename FROM pg_tables WHERE schemaname = 'public';"

      # Pousse le schéma Prisma vers la DB de test (crée les tables)
      - name: Push database schema
        run: |
          echo "🔄 Pushing Prisma schema to test database..."
          npx prisma db push --force-reset --accept-data-loss
          echo "✅ Schema pushed"
          echo "📋 Verifying tables were created..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;"

      # Seed de la base de données avec les données de test
      - name: Seed test database
        run: |
          echo "🌱 Seeding test database..."
          npx prisma db seed
          echo "✅ Seed completed"

      # Vérifie que les utilisateurs de test existent
      - name: Verify test users
        run: |
          echo "🔍 Checking test users..."
          npx prisma db execute --schema ./prisma/schema.prisma --stdin <<< "SELECT email, role FROM \"User\" LIMIT 5;"

      # Lance les tests E2E
      # Le webServer démarre automatiquement Next.js avant les tests
      # Les variables sont déjà dans le fichier .env créé plus tôt
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      # Upload du rapport HTML Playwright
      # Toujours uploadé même si les tests échouent (pour debug)
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Upload des screenshots/traces en cas d'échec
      - name: Upload test results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ============================================
  # JOB 4 : BUILD
  # ============================================
  # Vérifie que l'application peut être buildée
  # Détecte les erreurs de compilation Next.js
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e]
    # Attend lint, test ET test-e2e avant de builder
    # Le build est l'étape la plus longue, on l'exécute en dernier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Build Next.js en mode production
      # Crée le dossier .next avec l'application optimisée
      - name: Build Next.js application
        run: npm run build
        env:
          # Variables minimales pour le build
          # Les vraies valeurs seront injectées en production
          DATABASE_URL: 'postgresql://fake:fake@localhost:5432/fake'
          NEXTAUTH_SECRET: 'build-secret'
          NEXTAUTH_URL: 'http://localhost:3000'

      # Sauvegarde du build pour réutilisation
      # Utile si on veut déployer ce build exact
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            .next/
            !.next/cache/
          retention-days: 1
# ==============================================
# RÉSUMÉ DU PIPELINE CI
# ==============================================
#
#
# FLUX D'EXÉCUTION :
#                    ┌──────────────────┐
#                    │       LINT       │
#                    └────────┬─────────┘
#                             │
#              ┌──────────────┴──────────────┐
#              ▼                             ▼
#     ┌────────────────┐          ┌────────────────┐
#     │  TEST (Unit)   │          │  TEST-E2E      │
#     │   (Vitest)     │          │  (Playwright)  │
#     └────────┬───────┘          └────────┬───────┘
#              │                           │
#              └──────────────┬────────────┘
#                             ▼
#                    ┌─────────────────┐
#                    │      BUILD      │
#                    └─────────────────┘
#
# TESTS :
# - Unit tests : Vitest + RTL + MSW (15 tests)
# - E2E tests : Playwright (12 tests, 3 navigateurs)
#
# BONNES PRATIQUES APPLIQUÉES :
# - Jobs parallèles (test + test-e2e) pour rapidité
# - Jobs séquentiels avec "needs" (fail fast)
# - Cache npm pour accélérer les runs
# - Artefacts pour traçabilité (coverage, playwright-report)
# - Permissions minimales (sécurité)
# - Variables d'environnement mockées pour le CI
# ==============================================
