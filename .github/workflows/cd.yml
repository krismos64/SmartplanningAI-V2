# ==============================================
# SMARTPLANNING - PIPELINE CD (Continuous Deployment)
# ==============================================
#
# CD = Déploiement Continu. Ce pipeline :
# 1. Build l'image Docker de production
# 2. Push l'image sur GitHub Container Registry (ghcr.io)
# 3. Se connecte au VPS OVH via SSH
# 4. Applique les migrations Prisma (nouvelle image, conteneur éphémère)
# 5. Redémarre le conteneur app avec la nouvelle image
#
# DÉCLENCHEUR : Après succès du CI sur la branche main
# TEMPS D'EXÉCUTION ESTIMÉ : ~5-8 minutes
#
# ⚠️ SÉCURITÉ IMPORTANTE :
# Le CD ne se déclenche QUE si le workflow CI réussit complètement.
# Cela inclut :
# - Lint & Type Check ✅
# - Tests unitaires (~5638 tests) ✅
# - Tests E2E Playwright (~180 tests critiques) ✅
# - Build Next.js ✅
#
# Ainsi, même un push direct sur main sans PR passe par les tests E2E
# avant d'être déployé en production.
#
# PRÉREQUIS SECRETS GITHUB :
# - VPS_HOST : IP ou domaine du VPS
# - VPS_USER : Utilisateur SSH (ex: deploy)
# - VPS_SSH_KEY : Clé SSH privée pour connexion
# - VPS_SSH_PORT : Port SSH (default: 22)
# NOTE: L'authentification GHCR est configurée de manière persistante sur le VPS
#       via ~/.docker/config.json (pas besoin de secret GHCR_PAT)
# ==============================================

name: CD - Build & Deploy

# ----------------------------------------------
# DÉCLENCHEUR
# ----------------------------------------------
# Uniquement sur push vers main
# On ne déploie JAMAIS automatiquement depuis d'autres branches
on:
  # CD se déclenche après le succès de CI
  workflow_run:
    workflows: ["CI - Lint, Test & Build"]
    branches: [main]
    types: [completed]
  # workflow_dispatch permet de lancer manuellement
  # depuis l'interface GitHub (onglet Actions)
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environnement de déploiement'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# ----------------------------------------------
# PERMISSIONS
# ----------------------------------------------
# Permissions nécessaires pour :
# - contents: read = lire le code source
# - packages: write = push l'image sur ghcr.io
permissions:
  contents: read
  packages: write

# ----------------------------------------------
# VARIABLES D'ENVIRONNEMENT
# ----------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 📚 CDA : github.repository = "krismos64/smartplanning"
  # Donc IMAGE_NAME = ghcr.io/krismos64/smartplanning

# ----------------------------------------------
# JOBS
# ----------------------------------------------
jobs:
  # ============================================
  # JOB 1 : BUILD & PUSH IMAGE DOCKER
  # ============================================
  # Construit l'image et la pousse sur le registry
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Ne déploie que si CI a réussi (ou si lancé manuellement)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    outputs:
      # Output = valeur transmise aux jobs suivants
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU permet de builder pour différentes architectures
      # (arm64 pour Mac M1, amd64 pour serveurs Linux)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # BuildX = builder Docker avancé avec cache multi-layer
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion au GitHub Container Registry
      # Utilise le token GitHub automatique (pas de secret à configurer)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # 📚 CDA : GITHUB_TOKEN est automatiquement fourni par GitHub
          # Pas besoin de le créer manuellement

      # Génère les tags et labels pour l'image
      # - latest pour le dernier commit sur main
      # - sha-xxxx pour identifier la version exacte
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      # Build multi-stage avec cache GitHub Actions
      # Le cache accélère les builds suivants (~50% plus rapide)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # platforms = architectures cibles
          # amd64 = serveurs classiques, arm64 = Mac M1/M2
          platforms: linux/amd64
          # Cache GitHub Actions pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args pour optimisations
          build-args: |
            NODE_ENV=production

      # Résumé du build affiché dans GitHub Actions
      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  # ============================================
  # JOB 2 : MIGRATIONS DB
  # ============================================
  # Exécute prisma migrate deploy AVANT le redémarrage du conteneur app.
  #
  # POURQUOI AVANT LE DEPLOY ?
  # L'ancien ordre (deploy → migrate) créait une fenêtre où le nouveau code
  # tournait avec l'ancien schéma. Si une future migration ajoute une colonne
  # NOT NULL sans valeur par défaut, l'app crasherait immédiatement.
  # L'ordre correct est : schéma à jour d'abord, nouveau code ensuite.
  #
  # POURQUOI docker run --rm ET PAS exec SUR L'ANCIEN CONTENEUR ?
  # Les fichiers prisma/migrations/ sont embarqués dans l'image Docker.
  # L'ancien conteneur ne connaît pas les nouvelles migrations (elles n'y sont
  # pas). On pull la nouvelle image et on l'utilise en conteneur éphémère
  # (--rm) pour appliquer les migrations sur la DB, sans toucher au conteneur
  # running. Le service app continue de servir les requêtes pendant ce temps.
  #
  # POURQUOI workflow_run ET PAS workflow_dispatch ?
  # - workflow_run : déclenché automatiquement après CI → migrations auto
  # - workflow_dispatch : déploiement manuel → pas de migrations auto
  #   (évite d'exécuter des migrations non prévues lors d'un redéploiement manuel)
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_run' }}
    # N'exécute pas les migrations sur workflow_dispatch manuel
    # Car un déploiement manuel est souvent un rollback ou un redémarrage

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run Prisma migrations via SSH
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'MIGRATE_SCRIPT'
          set -e
          echo "🗄️ Pull de la nouvelle image pour les migrations..."
          cd /var/www/smartplanning
          docker pull --quiet ghcr.io/krismos64/smartplanningai-v2:latest

          echo "🗄️ Exécution des migrations Prisma (conteneur éphémère)..."
          # On utilise la nouvelle image via docker run --rm (pas exec sur l'ancien conteneur)
          # car les fichiers prisma/migrations/ sont dans la nouvelle image, pas l'ancienne.
          # --network host permet d'atteindre PostgreSQL sur le réseau Docker Compose.
          DATABASE_URL=$(grep -oP 'DATABASE_URL=\K.*' .env)
          # Récupère le réseau Docker du conteneur postgres pour y joindre
          # le conteneur éphémère — évite de hardcoder le nom préfixé par Compose.
          DB_NETWORK=$(docker inspect smartplanning-postgres --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          docker run --rm \
            --network "$DB_NETWORK" \
            -e DATABASE_URL="$DATABASE_URL" \
            ghcr.io/krismos64/smartplanningai-v2:latest \
            npx prisma migrate deploy
          echo "✅ Migrations terminées !"
          MIGRATE_SCRIPT

  # ============================================
  # JOB 3 : DÉPLOIEMENT SUR VPS
  # ============================================
  # Se connecte au VPS et redémarre le conteneur app avec la nouvelle image.
  # Les migrations sont déjà appliquées (job migrate) : le nouveau code démarre
  # avec un schéma déjà à jour — aucune fenêtre de mismatch.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    # Attend toujours build-and-push.
    # Attend migrate quand il tourne (workflow_run). GitHub considère un job
    # skippé (if: false) comme résultat "skipped", pas "failure" — deploy
    # n'est donc pas bloqué lors d'un workflow_dispatch manuel.
    if: ${{ always() && needs.build-and-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}

    steps:
      # Connexion SSH au VPS et exécution des commandes
      # Créer le fichier de clé SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS via SSH
        timeout-minutes: 10
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          echo "🚀 Début du déploiement SmartPlanning..."
          cd /var/www/smartplanning

          echo "📦 Pull de la nouvelle image (déjà en cache si migrate a tourné)..."
          docker pull --quiet ghcr.io/krismos64/smartplanningai-v2:latest
          echo "📋 Image digest:"
          docker images ghcr.io/krismos64/smartplanningai-v2:latest --format "{{.ID}} {{.CreatedAt}}"

          echo "♻️ Redémarrage du conteneur app avec la nouvelle image..."
          # On ne fait PAS down/up complet : seul le conteneur app est recréé
          # PostgreSQL et Redis restent up = pas de coupure DB
          docker compose --env-file .env up -d --no-deps --force-recreate app
          # Downtime réduit à ~5-10s (temps de recréation du conteneur)

          echo "⏳ Attente du healthcheck..."
          # SP-470 : Charger HEALTH_API_KEY depuis .env pour le healthcheck authentifié
          HEALTH_KEY=$(grep -oP 'HEALTH_API_KEY=\K.*' .env 2>/dev/null || echo "")
          RETRIES=0
          MAX_RETRIES=30
          until [ $RETRIES -ge $MAX_RETRIES ]; do
            HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $HEALTH_KEY" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HEALTH_RESPONSE" = "200" ]; then
              echo "✅ Application déployée avec succès ! (healthcheck OK en ~$((RETRIES * 5))s)"
              break
            fi
            RETRIES=$((RETRIES + 1))
            echo "  ⏳ Tentative $RETRIES/$MAX_RETRIES (HTTP $HEALTH_RESPONSE)..."
            sleep 5
          done

          if [ $RETRIES -ge $MAX_RETRIES ]; then
            echo "⚠️ Healthcheck timeout après $((MAX_RETRIES * 5))s"
            echo "📋 Logs récents:"
            docker compose --env-file .env logs app --tail 30
            echo "📋 Status des conteneurs:"
            docker compose --env-file .env ps
            echo "✅ Déploiement terminé (avec warnings)"
          fi

          echo "🧹 Nettoyage des anciennes images..."
          docker image prune -f
          echo "🎉 Déploiement terminé !"
          DEPLOY_SCRIPT

      # Notification de succès (optionnel)
      # Peut être remplacé par Slack, Discord, email...
      - name: Deployment Summary
        run: |
          echo "## Déploiement réussi ! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build-and-push.outputs.image_digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://smartplanning.fr" >> $GITHUB_STEP_SUMMARY

# ==============================================
# RÉSUMÉ DU PIPELINE CD
# ==============================================
#
# CHAÎNE DE SÉCURITÉ COMPLÈTE (CI → CD) :
# ┌─────────────────────────────────────────────────────────────────────┐
# │                        PIPELINE CI                                   │
# │  ┌──────────┐   ┌──────────┐   ┌──────────────┐   ┌───────────┐    │
# │  │   LINT   │──►│  TESTS   │──►│  TESTS E2E   │──►│   BUILD   │    │
# │  │ TypeCheck│   │  UNIT    │   │  (Chromium)  │   │  Next.js  │    │
# │  └──────────┘   │  5638+   │   │    ~180      │   └───────────┘    │
# │                 └──────────┘   └──────────────┘                     │
# └─────────────────────────────────────────────────────────────────────┘
#                                    │
#                                    │ workflow_run (success)
#                                    ▼
# ┌─────────────────────────────────────────────────────────────────────┐
# │                        PIPELINE CD                                   │
# │  ┌─────────────────┐     ┌─────────────┐     ┌───────────┐         │
# │  │  BUILD & PUSH   │ ──► │   MIGRATE   │ ──► │   DEPLOY  │         │
# │  │  (Docker Image) │     │  (Prisma)   │     │  (VPS)    │         │
# │  └─────────────────┘     └─────────────┘     └───────────┘         │
# └─────────────────────────────────────────────────────────────────────┘
#
# POURQUOI CETTE DOUBLE SÉCURITÉ ?
# ────────────────────────────────
# 1. Les tests E2E sont OBLIGATOIRES sur main (PR ou push direct)
# 2. Le CD ne se déclenche QUE si le CI complet réussit
# 3. Aucun code non testé ne peut atteindre la production
# 4. Même un hotfix direct sur main passe par tous les tests
#
# SÉCURITÉ :
# - Secrets GitHub pour les credentials VPS
# - Token GitHub automatique pour le registry
# - SSH avec clé privée (pas de mot de passe)
# - workflow_run garantit l'exécution séquentielle CI → CD
#
# ROLLBACK :
# En cas de problème, vous pouvez revenir à une version précédente :
# 1. Trouver le tag sha-xxxx de la version stable
# 2. Sur le VPS : docker pull ghcr.io/krismos64/smartplanning:sha-xxxx
# 3. Redémarrer : docker compose up -d
# ==============================================
