# ==============================================
# SMARTPLANNING - PIPELINE CD (Continuous Deployment)
# ==============================================
#
# CD = Déploiement Continu. Ce pipeline :
# 1. Build l'image Docker de production
# 2. Push l'image sur GitHub Container Registry (ghcr.io)
# 3. Se connecte au VPS OVH via SSH
# 4. Applique les migrations Prisma (nouvelle image, conteneur éphémère)
# 5. Redémarre le conteneur app avec la nouvelle image
#
# DÉCLENCHEUR : Après succès du CI sur la branche main
# TEMPS D'EXÉCUTION ESTIMÉ : ~5-8 minutes
#
# ⚠️ SÉCURITÉ IMPORTANTE :
# Le CD ne se déclenche QUE si le workflow CI réussit complètement.
# Cela inclut :
# - Lint & Type Check ✅
# - Tests unitaires (~5638 tests) ✅
# - Tests E2E Playwright (~180 tests critiques) ✅
# - Build Next.js ✅
#
# Ainsi, même un push direct sur main sans PR passe par les tests E2E
# avant d'être déployé en production.
#
# PRÉREQUIS SECRETS GITHUB :
# - VPS_HOST : IP ou domaine du VPS
# - VPS_USER : Utilisateur SSH (ex: deploy)
# - VPS_SSH_KEY : Clé SSH privée pour connexion
# - VPS_SSH_PORT : Port SSH (default: 22)
# NOTE: L'authentification GHCR est configurée de manière persistante sur le VPS
#       via ~/.docker/config.json (pas besoin de secret GHCR_PAT)
# ==============================================

name: CD - Build & Deploy

# ----------------------------------------------
# DÉCLENCHEUR
# ----------------------------------------------
# Uniquement sur push vers main
# On ne déploie JAMAIS automatiquement depuis d'autres branches
on:
  # CD se déclenche après le succès de CI
  workflow_run:
    workflows: ["CI - Lint, Test & Build"]
    branches: [main]
    types: [completed]
  # workflow_dispatch permet de lancer manuellement
  # depuis l'interface GitHub (onglet Actions)
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environnement de déploiement'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# ----------------------------------------------
# PERMISSIONS
# ----------------------------------------------
# Permissions nécessaires pour :
# - contents: read = lire le code source
# - packages: write = push l'image sur ghcr.io
permissions:
  contents: read
  packages: write

# ----------------------------------------------
# SÉRIALISATION DES DÉPLOIEMENTS (SP-588)
# ----------------------------------------------
# Sans cette clause, deux merges rapprochés lancent deux CD en parallèle, qui
# appliquent leurs migrations Prisma en même temps sur la même base.
#
# cancel-in-progress reste à false volontairement : un déploiement en cours a
# déjà migré la base et peut être en train de recréer le conteneur. L'annuler
# à mi-chemin laisserait la production dans un état indéterminé. Le second
# déploiement attend donc que le premier finisse.
concurrency:
  group: cd-production
  cancel-in-progress: false

# ----------------------------------------------
# VARIABLES D'ENVIRONNEMENT
# ----------------------------------------------
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 📚 CDA : github.repository = "krismos64/smartplanning"
  # Donc IMAGE_NAME = ghcr.io/krismos64/smartplanning

# ----------------------------------------------
# JOBS
# ----------------------------------------------
jobs:
  # ============================================
  # JOB 1 : BUILD & PUSH IMAGE DOCKER
  # ============================================
  # Construit l'image et la pousse sur le registry
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Ne déploie que si CI a réussi (ou si lancé manuellement)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    outputs:
      # Output = valeur transmise aux jobs suivants
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # QEMU permet de builder pour différentes architectures
      # (arm64 pour Mac M1, amd64 pour serveurs Linux)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # BuildX = builder Docker avancé avec cache multi-layer
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion au GitHub Container Registry
      # Utilise le token GitHub automatique (pas de secret à configurer)
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # 📚 CDA : GITHUB_TOKEN est automatiquement fourni par GitHub
          # Pas besoin de le créer manuellement

      # Génère les tags et labels pour l'image
      # - latest pour le dernier commit sur main
      # - sha-xxxx pour identifier la version exacte
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      # Build multi-stage avec cache GitHub Actions
      # Le cache accélère les builds suivants (~50% plus rapide)
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # platforms = architectures cibles
          # amd64 = serveurs classiques, arm64 = Mac M1/M2
          platforms: linux/amd64
          # Cache GitHub Actions pour accélérer les builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args pour optimisations
          build-args: |
            NODE_ENV=production

      # Résumé du build affiché dans GitHub Actions
      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

  # ============================================
  # JOB 2 : MIGRATIONS DB
  # ============================================
  # Exécute prisma migrate deploy AVANT le redémarrage du conteneur app.
  #
  # POURQUOI AVANT LE DEPLOY ?
  # L'ancien ordre (deploy → migrate) créait une fenêtre où le nouveau code
  # tournait avec l'ancien schéma. Si une future migration ajoute une colonne
  # NOT NULL sans valeur par défaut, l'app crasherait immédiatement.
  # L'ordre correct est : schéma à jour d'abord, nouveau code ensuite.
  #
  # POURQUOI docker run --rm ET PAS exec SUR L'ANCIEN CONTENEUR ?
  # Les fichiers prisma/migrations/ sont embarqués dans l'image Docker.
  # L'ancien conteneur ne connaît pas les nouvelles migrations (elles n'y sont
  # pas). On pull la nouvelle image et on l'utilise en conteneur éphémère
  # (--rm) pour appliquer les migrations sur la DB, sans toucher au conteneur
  # running. Le service app continue de servir les requêtes pendant ce temps.
  #
  # POURQUOI workflow_run ET PAS workflow_dispatch ?
  # - workflow_run : déclenché automatiquement après CI → migrations auto
  # - workflow_dispatch : déploiement manuel → pas de migrations auto
  #   (évite d'exécuter des migrations non prévues lors d'un redéploiement manuel)
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_run' }}
    # N'exécute pas les migrations sur workflow_dispatch manuel
    # Car un déploiement manuel est souvent un rollback ou un redémarrage

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # SP-588 : l'image est désignée par son SHA de commit, jamais par latest.
      # Le tag latest est mouvant : entre le build de ce workflow et ce pull, un
      # autre build a pu le déplacer, et les migrations s'appliqueraient depuis
      # une image inattendue.
      - name: Run Prisma migrations via SSH
        timeout-minutes: 5
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'MIGRATE_SCRIPT'
          set -e
          IMAGE="ghcr.io/krismos64/smartplanningai-v2:${IMAGE_TAG}"
          echo "🗄️ Pull de l'image $IMAGE pour les migrations..."
          cd /var/www/smartplanning
          docker pull --quiet "$IMAGE"

          echo "🗄️ Exécution des migrations Prisma (conteneur éphémère)..."
          # Lire DATABASE_URL depuis le conteneur app running (environnement déjà résolu,
          # sans guillemets ni commentaires — plus fiable que parser le .env brut).
          DB_NETWORK=$(docker inspect smartplanning-postgres --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          DATABASE_URL=$(docker exec smartplanning-app printenv DATABASE_URL)
          docker run --rm \
            --network "$DB_NETWORK" \
            -e DATABASE_URL="$DATABASE_URL" \
            "$IMAGE" \
            npx prisma migrate deploy
          echo "✅ Migrations terminées !"
          MIGRATE_SCRIPT

  # ============================================
  # JOB 3 : DÉPLOIEMENT SUR VPS
  # ============================================
  # Se connecte au VPS et redémarre le conteneur app avec la nouvelle image.
  # Les migrations sont déjà appliquées (job migrate) : le nouveau code démarre
  # avec un schéma déjà à jour — aucune fenêtre de mismatch.
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate]
    # Attend toujours build-and-push.
    # Attend migrate quand il tourne (workflow_run). GitHub considère un job
    # skippé (if: false) comme résultat "skipped", pas "failure" — deploy
    # n'est donc pas bloqué lors d'un workflow_dispatch manuel.
    if: ${{ always() && needs.build-and-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}

    steps:
      # SP-580 : le compose doit venir du dépôt, pas du VPS.
      # Sans ce checkout, /var/www/smartplanning/docker-compose.yml n'était
      # jamais mis à jour et dérivait à chaque édition manuelle sur le serveur.
      - name: Checkout
        uses: actions/checkout@v4

      # Connexion SSH au VPS et exécution des commandes
      # Créer le fichier de clé SSH
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # SP-580 : le dépôt fait autorité sur la configuration d'infrastructure.
      # Le fichier est copié avant le up, donc le conteneur est recréé avec la
      # configuration versionnée. Une édition manuelle sur le VPS est écrasée
      # au déploiement suivant, ce qui est le comportement voulu.
      # SP-583 : seul le compose de l'application est synchronisé. Umami tourne
      # depuis /home/deploy/umami/docker-compose.yml, hors du dépôt, avec ses
      # secrets en clair et sans BASE_PATH. Toute correction le concernant
      # s'applique à la main sur le VPS, ce fichier-ci ne la porterait pas.
      - name: Synchroniser le docker-compose depuis le dépôt
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -P ${{ secrets.VPS_SSH_PORT || 22 }} \
            docker/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/smartplanning/docker-compose.yml

      # SP-588 : trois changements par rapport à la version d'origine.
      #
      # 1. L'image est désignée par son SHA de commit, et le compose lit déjà
      #    ${IMAGE_TAG:-latest}. On déploie donc exactement l'image construite
      #    par ce workflow, pas "la dernière poussée quelle qu'elle soit".
      # 2. Le tag en place est capturé AVANT le remplacement, ce qui donne une
      #    cible de rollback.
      # 3. Un healthcheck en échec déclenche le rollback puis sort en code 1.
      #    L'ancienne version écrivait "Déploiement terminé (avec warnings)" et
      #    laissait le job réussir : un conteneur qui ne démarrait pas devenait
      #    la production, annoncée comme un succès.
      - name: Deploy to VPS via SSH
        timeout-minutes: 10
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=30 -p ${{ secrets.VPS_SSH_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "IMAGE_TAG='$IMAGE_TAG' bash -s" << 'DEPLOY_SCRIPT'
          set -e
          REPO="ghcr.io/krismos64/smartplanningai-v2"
          IMAGE="${REPO}:${IMAGE_TAG}"
          echo "🚀 Début du déploiement SmartPlanning ($IMAGE_TAG)..."
          cd /var/www/smartplanning

          # --- Capture de la version en place, cible du rollback ---
          # On lit l'image du conteneur running plutôt que le .env : c'est ce qui
          # tourne réellement qui fait foi, pas ce que le fichier prétend.
          PREVIOUS_IMAGE=$(docker inspect smartplanning-app --format '{{.Config.Image}}' 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_IMAGE" ]; then
            echo "📌 Version en place, cible de rollback : $PREVIOUS_IMAGE"
          else
            echo "📌 Aucun conteneur en place (premier déploiement), rollback impossible"
          fi

          echo "📦 Pull de l'image $IMAGE (déjà en cache si migrate a tourné)..."
          docker pull --quiet "$IMAGE"

          echo "♻️ Redémarrage du conteneur app avec la nouvelle image..."
          # On ne fait PAS down/up complet : seul le conteneur app est recréé
          # PostgreSQL et Redis restent up = pas de coupure DB
          IMAGE_TAG="$IMAGE_TAG" docker compose --env-file .env up -d --no-deps --force-recreate app
          # Downtime réduit à ~5-10s (temps de recréation du conteneur)

          echo "⏳ Attente du healthcheck..."
          # SP-470 : Charger HEALTH_API_KEY depuis .env pour le healthcheck authentifié
          HEALTH_KEY=$(grep -oP 'HEALTH_API_KEY=\K.*' .env 2>/dev/null || echo "")
          RETRIES=0
          MAX_RETRIES=30
          HEALTHY=0
          until [ $RETRIES -ge $MAX_RETRIES ]; do
            HEALTH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $HEALTH_KEY" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HEALTH_RESPONSE" = "200" ]; then
              echo "✅ Healthcheck OK en ~$((RETRIES * 5))s"
              HEALTHY=1
              break
            fi
            RETRIES=$((RETRIES + 1))
            echo "  ⏳ Tentative $RETRIES/$MAX_RETRIES (HTTP $HEALTH_RESPONSE)..."
            sleep 5
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Healthcheck en échec après $((MAX_RETRIES * 5))s"
            echo "📋 Logs récents:"
            docker compose --env-file .env logs app --tail 50
            echo "📋 Status des conteneurs:"
            docker compose --env-file .env ps

            if [ -n "$PREVIOUS_IMAGE" ]; then
              PREVIOUS_TAG="${PREVIOUS_IMAGE##*:}"
              echo "⏮️ Rollback vers $PREVIOUS_IMAGE..."
              # set -e est neutralisé sur ce bloc : un rollback qui échoue ne doit
              # pas masquer l'échec du déploiement, qui reste l'information utile.
              set +e
              IMAGE_TAG="$PREVIOUS_TAG" docker compose --env-file .env up -d --no-deps --force-recreate app
              ROLLBACK_RC=$?
              set -e
              if [ $ROLLBACK_RC -ne 0 ]; then
                echo "🔥 Le rollback a échoué (code $ROLLBACK_RC). Intervention manuelle requise."
              else
                echo "⏳ Vérification du healthcheck après rollback..."
                RB_RETRIES=0
                RB_HEALTHY=0
                until [ $RB_RETRIES -ge 20 ]; do
                  RB_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $HEALTH_KEY" http://localhost:3000/api/health 2>/dev/null || echo "000")
                  if [ "$RB_RESPONSE" = "200" ]; then
                    RB_HEALTHY=1
                    break
                  fi
                  RB_RETRIES=$((RB_RETRIES + 1))
                  sleep 5
                done
                if [ "$RB_HEALTHY" -eq 1 ]; then
                  echo "✅ Rollback réussi, la version précédente répond."
                else
                  echo "🔥 La version précédente ne répond pas non plus. Intervention manuelle requise."
                fi
              fi
            fi

            # ATTENTION : le rollback restaure le CODE, jamais le SCHÉMA.
            # Le job migrate a déjà appliqué ses migrations, et Prisma ne les
            # défait pas. Si l'échec vient d'une migration, l'ancienne image
            # tourne sur un schéma plus récent qu'elle. Vérifier la base.
            echo "⚠️ Migrations NON annulées par ce rollback, vérifier l'état du schéma."
            exit 1
          fi

          echo "🧹 Nettoyage des anciennes images..."
          # --filter until=168h : garde une semaine d'images, donc les cibles de
          # rollback récentes. Un prune -f nu supprimait l'image de la version
          # précédente dès qu'elle n'était plus référencée.
          docker image prune -f --filter "until=168h"
          echo "🎉 Déploiement terminé et vérifié !"
          DEPLOY_SCRIPT

      # SP-588 : ce résumé n'est écrit que si l'étape de déploiement a réussi,
      # healthcheck compris. Auparavant il était inconditionnel et annonçait
      # "Déploiement réussi" même quand l'application ne répondait pas.
      - name: Deployment Summary
        if: success()
        run: |
          echo "## Déploiement réussi et vérifié 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build-and-push.outputs.image_digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Healthcheck:** 200 sur /api/health" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://smartplanning.fr" >> $GITHUB_STEP_SUMMARY

      # Le pendant du précédent : rendre l'échec lisible sans ouvrir les logs.
      - name: Deployment Failure Summary
        if: failure()
        run: |
          echo "## Déploiement en échec ❌" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image visée:** ghcr.io/${{ github.repository }}:sha-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Un rollback vers la version précédente a été tenté, voir les logs de l'étape de déploiement." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Les migrations Prisma ne sont pas annulées par le rollback.** Vérifier l'état du schéma avant de rejouer un déploiement." >> $GITHUB_STEP_SUMMARY

# ==============================================
# RÉSUMÉ DU PIPELINE CD
# ==============================================
#
# CHAÎNE DE SÉCURITÉ COMPLÈTE (CI → CD) :
# ┌─────────────────────────────────────────────────────────────────────┐
# │                        PIPELINE CI                                   │
# │  ┌──────────┐   ┌──────────┐   ┌──────────────┐   ┌───────────┐    │
# │  │   LINT   │──►│  TESTS   │──►│  TESTS E2E   │──►│   BUILD   │    │
# │  │ TypeCheck│   │  UNIT    │   │  (Chromium)  │   │  Next.js  │    │
# │  └──────────┘   │  5638+   │   │    ~180      │   └───────────┘    │
# │                 └──────────┘   └──────────────┘                     │
# └─────────────────────────────────────────────────────────────────────┘
#                                    │
#                                    │ workflow_run (success)
#                                    ▼
# ┌─────────────────────────────────────────────────────────────────────┐
# │                        PIPELINE CD                                   │
# │  ┌─────────────────┐     ┌─────────────┐     ┌───────────┐         │
# │  │  BUILD & PUSH   │ ──► │   MIGRATE   │ ──► │   DEPLOY  │         │
# │  │  (Docker Image) │     │  (Prisma)   │     │  (VPS)    │         │
# │  └─────────────────┘     └─────────────┘     └───────────┘         │
# └─────────────────────────────────────────────────────────────────────┘
#
# POURQUOI CETTE DOUBLE SÉCURITÉ ?
# ────────────────────────────────
# 1. Les tests E2E sont OBLIGATOIRES sur main (PR ou push direct)
# 2. Le CD ne se déclenche QUE si le CI complet réussit
# 3. Aucun code non testé ne peut atteindre la production
# 4. Même un hotfix direct sur main passe par tous les tests
#
# SÉCURITÉ :
# - Secrets GitHub pour les credentials VPS
# - Token GitHub automatique pour le registry
# - SSH avec clé privée (pas de mot de passe)
# - workflow_run garantit l'exécution séquentielle CI → CD
#
# ROLLBACK (SP-588) :
# ────────────────────
# AUTOMATIQUE : si le healthcheck ne passe pas dans les 150 secondes, le
# déploiement restaure l'image précédente, revérifie qu'elle répond, puis sort
# en code 1. Le workflow apparaît en rouge et le résumé d'échec l'explique.
#
# MANUEL, si le rollback automatique a lui aussi échoué :
# 1. Trouver le tag de la version stable : docker images ghcr.io/krismos64/smartplanningai-v2
# 2. Sur le VPS, dans /var/www/smartplanning :
#    IMAGE_TAG=sha-xxxx docker compose --env-file .env up -d --no-deps --force-recreate app
# 3. Vérifier : curl -H "Authorization: Bearer $HEALTH_KEY" http://localhost:3000/api/health
#
# LIMITE CONNUE, LES MIGRATIONS NE SONT PAS ANNULÉES :
# Le job migrate s'exécute AVANT le déploiement et Prisma ne défait pas une
# migration appliquée. Un rollback restaure donc le code sur un schéma qui,
# lui, reste en avant. C'est sans conséquence pour une migration additive
# (nouvelle colonne nullable, nouvelle table), et cassant pour une migration
# destructive (colonne supprimée ou renommée) : l'ancienne image cherchera une
# colonne qui n'existe plus.
#
# D'où la règle : toute migration destructive se fait en deux temps (expand /
# contract), une première PR qui ajoute sans retirer, une seconde qui retire
# une fois l'ancienne version hors production.
# ==============================================
