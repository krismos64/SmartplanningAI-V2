# ==============================================
# SMARTPLANNING - NIGHTLY TESTS (Unitaires + E2E complets)
# ==============================================
#
# Suite COMPLÈTE des tests exécutée chaque nuit :
# 1. Tests unitaires Vitest (~2 746 tests)
# 2. Tests E2E Playwright desktop (189 tests, 13 specs)
#
# Permet de détecter les régressions sans bloquer les PR.
#
# Exécution : tous les jours à 2h00 UTC (3h00 Paris)
# Peut aussi être lancé manuellement depuis GitHub.
#
# @ticket SP-333

name: Nightly Tests (Unit + E2E)

on:
  # Exécution planifiée : tous les jours à 2h00 UTC
  schedule:
    - cron: '0 2 * * *'

  # Permet de lancer manuellement depuis GitHub
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # JOB 1 : TESTS UNITAIRES (Vitest)
  # ============================================
  # Lance TOUS les tests unitaires (~2 746 tests)
  # Pas besoin de PostgreSQL : les tests unitaires mockent Prisma
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run all unit tests
        run: npm run test:coverage
        env:
          DATABASE_URL: 'file:./test.db'
          NEXTAUTH_SECRET: 'test-secret-for-nightly'
          NEXTAUTH_URL: 'http://localhost:3000'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 7

  # ============================================
  # JOB 2 : TESTS E2E COMPLETS (Playwright)
  # ============================================
  # Lance TOUS les tests E2E desktop (189 tests, 13 specs)
  # Chromium uniquement, pas de tests mobile actuellement
  e2e-tests:
    name: Full E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Service container PostgreSQL
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smartplanning_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d smartplanning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup database environment
        run: |
          echo "DATABASE_URL=postgresql://test:test@localhost:5432/smartplanning_test" > .env
          echo "NEXTAUTH_SECRET=test-secret-for-nightly" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
          echo "AUTH_URL=http://localhost:3000" >> .env
          echo "AUTH_SECRET=test-secret-for-nightly" >> .env
          echo "AUTH_TRUST_HOST=true" >> .env

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "PostgreSQL is ready!"
              break
            fi
            sleep 1
          done

      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      - name: Seed test database
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test

      # === BUILD PRODUCTION ===
      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test
          NEXTAUTH_SECRET: test-secret-for-nightly
          NEXTAUTH_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: test-secret-for-nightly
          AUTH_TRUST_HOST: 'true'

      # === SUITE COMPLÈTE NIGHTLY ===
      - name: Run Full E2E Suite
        run: npx playwright test --config=playwright.nightly.config.ts
        env:
          CI: true
          DATABASE_URL: postgresql://test:test@localhost:5432/smartplanning_test
          NEXTAUTH_SECRET: test-secret-for-nightly
          NEXTAUTH_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          AUTH_SECRET: test-secret-for-nightly
          AUTH_TRUST_HOST: 'true'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7
