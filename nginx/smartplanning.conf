# ==============================================
# SMARTPLANNING - CONFIGURATION NGINX
# ==============================================
#
# 📚 EXPLICATIONS CDA (Concepteur Développeur d'Applications) :
# --------------------------------------------------------------
# Cette configuration Nginx sert de reverse proxy pour l'application Next.js 15
# SmartPlanning V2. Un reverse proxy est un serveur intermédiaire qui reçoit les
# requêtes des clients et les transmet au serveur d'application backend.
#
# 🎯 AVANTAGES DU REVERSE PROXY :
# - Sécurité : Filtrage des requêtes malveillantes, rate limiting, blocage d'IPs
# - Performance : Gzip compression, cache des assets statiques
# - SSL/TLS : Gestion des certificats HTTPS (terminaison SSL)
# - Scalabilité : Possibilité d'ajouter du load balancing
# - Logs : Centralisation et analyse du trafic
#
# 📋 ARCHITECTURE :
# [Client] → [Nginx :80/443] → [Next.js :3000] → [PostgreSQL/Redis]
#
# 🔒 SÉCURITÉ (SP-157 Security Audit) :
# - Rate limiting par zone (général, auth, API)
# - Limitation des connexions simultanées par IP
# - Blocage des extensions dangereuses (.php, .env, etc.)
# - Headers de sécurité (CSP défini dans Next.js)
# - Protection contre les slow connection attacks
# - Payload size limits
#
# 📚 SOURCES Context7 :
# - Nginx Official Documentation (https://nginx.org/en/docs/)
# - Next.js Self-Hosting Guide (https://nextjs.org/docs/app/guides/self-hosting)
# - OWASP Security Best Practices
#
# ==============================================

# ----------------------------------------------
# RATE LIMITING ZONES
# ----------------------------------------------
# Les zones de rate limiting limitent le nombre de requêtes par seconde/minute
# pour protéger l'application contre les abus et les attaques DDoS.
#
# 📚 CDA : $binary_remote_addr = adresse IP du client (format binaire compact)
# zone=nom:taille = zone de mémoire partagée (10m = 10 MB ≈ 160 000 IPs)
# rate=Xr/s ou Xr/m = nombre de requêtes par seconde ou minute

# Zone générale : 10 requêtes/seconde par IP
# Utilisée pour les pages publiques et les assets statiques
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Zone auth : 3 requêtes/minute par IP
# Protection contre les attaques brute-force sur login/register
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/m;

# Zone API : 30 requêtes/seconde par IP
# Pour les appels API fréquents (dashboard, planning, etc.)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Limite de connexions simultanées : 10 par IP
# Empêche un client d'ouvrir trop de connexions en parallèle
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ----------------------------------------------
# UPSTREAM (Backend Next.js)
# ----------------------------------------------
# Définit le serveur backend (Next.js) vers lequel proxyfier les requêtes.
#
# 📚 CDA : upstream = groupe de serveurs backend (ici un seul : localhost:3000)
# keepalive = maintient X connexions ouvertes pour améliorer les perfs

upstream nextjs_backend {
    server localhost:3000;
    keepalive 32;
}

# ----------------------------------------------
# SERVER BLOCK HTTP (Port 80)
# ----------------------------------------------
# Redirige automatiquement tout le trafic HTTP vers HTTPS
#
# 📚 CDA : return 301 = redirection permanente vers HTTPS
# $host = nom de domaine (ex: smartplanning.fr)
# $request_uri = chemin complet de la requête (ex: /api/health)

server {
    listen 80;
    listen [::]:80;
    server_name smartplanning.fr www.smartplanning.fr;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

# ----------------------------------------------
# SERVER BLOCK HTTPS (Port 443)
# ----------------------------------------------
# Configuration principale du reverse proxy avec SSL/TLS

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartplanning.fr www.smartplanning.fr;

    # ----------------------------------------------
    # CERTIFICATS SSL (Let's Encrypt)
    # ----------------------------------------------
    # 📚 CDA : Ces chemins seront générés par certbot lors de l'installation
    # ssl_certificate = certificat public (.crt)
    # ssl_certificate_key = clé privée (.key)
    # À ADAPTER selon l'emplacement réel des certificats

    ssl_certificate /etc/letsencrypt/live/smartplanning.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartplanning.fr/privkey.pem;

    # Protocoles et chiffrements sécurisés (TLS 1.2 et 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP Stapling (améliore les performances SSL)
    ssl_stapling on;
    ssl_stapling_verify on;

    # Session SSL (réduit la latence)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----------------------------------------------
    # LOGS
    # ----------------------------------------------
    # 📚 CDA : $remote_addr = IP réelle du client
    # $request = méthode HTTP + URI + version
    # $status = code HTTP de la réponse (200, 404, 500, etc.)

    access_log /var/log/nginx/smartplanning-access.log;
    error_log /var/log/nginx/smartplanning-error.log warn;

    # ----------------------------------------------
    # LIMITS GLOBAUX
    # ----------------------------------------------

    # Limite de connexions simultanées : 10 par IP
    limit_conn conn_limit 10;

    # Taille maximale du corps de la requête (uploads)
    # 📚 CDA : 10M = 10 megabytes (à ajuster selon les besoins d'upload)
    client_max_body_size 10M;

    # Timeout pour les slow connection attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ----------------------------------------------
    # HEADERS DE SÉCURITÉ
    # ----------------------------------------------
    # 📚 CDA : Ces headers sont ajoutés EN COMPLÉMENT de ceux définis dans next.config.ts
    # Nginx les ajoute à TOUTES les réponses, même en cas d'erreur (always)

    # X-Frame-Options : Empêche l'embedding dans des iframes (protection clickjacking)
    add_header X-Frame-Options "DENY" always;

    # X-Content-Type-Options : Empêche le navigateur de deviner le type MIME
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection : Protection XSS legacy (remplacé par CSP mais garde pour compatibilité)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy : Contrôle les informations de référence envoyées
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----------------------------------------------
    # GZIP COMPRESSION
    # ----------------------------------------------
    # 📚 CDA : Compression des réponses pour réduire la bande passante
    # gzip_types = types MIME à compresser (HTML, CSS, JS, JSON, etc.)

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ----------------------------------------------
    # BLOCAGE DES REQUÊTES SUSPECTES
    # ----------------------------------------------

    # Bloquer l'accès aux fichiers cachés (.git, .env, .htaccess, etc.)
    # 📚 CDA : ~ = regex, /\. = commence par un point
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer les extensions dangereuses (PHP, ASP, scripts serveur)
    # 📚 CDA : ~* = regex insensible à la casse
    # $ = fin de l'URI (pour éviter /test.php.jpg)
    location ~* \.(php|asp|aspx|jsp|cgi|exe|sh|pl|py|rb)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquer explicitement l'accès à .env (fichier de configuration sensible)
    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------
    # ROUTES DE L'APPLICATION NEXT.JS
    # ----------------------------------------------

    # ----------------------------------------------
    # Route /api/auth/* - Authentification
    # ----------------------------------------------
    # 📚 CDA : Rate limiting strict (3 req/min) pour empêcher le brute-force
    # nodelay = rejette immédiatement les requêtes en excès (pas de file d'attente)

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # Headers pour passer les infos du client au backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Désactiver le buffering pour le streaming Next.js
        # 📚 CDA : Requis pour les Server Components et Suspense de Next.js 15
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    # ----------------------------------------------
    # Route /api/* - API générale
    # ----------------------------------------------
    # 📚 CDA : Rate limiting modéré (30 req/s) pour les appels API fréquents

    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Désactiver le buffering pour le streaming
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }

    # ----------------------------------------------
    # Route /_next/webpack-hmr - Hot Module Reloading (Dev uniquement)
    # ----------------------------------------------
    # 📚 CDA : WebSocket pour le HMR de Next.js (uniquement en dev, pas en prod)
    # Upgrade = passage du protocole HTTP vers WebSocket
    # Connection "upgrade" = maintient la connexion ouverte

    location /_next/webpack-hmr {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----------------------------------------------
    # Route / - Application principale
    # ----------------------------------------------
    # 📚 CDA : Rate limiting général (10 req/s) pour les pages publiques

    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection keep-alive pour améliorer les performances
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Désactiver le buffering pour le streaming Next.js
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;

        # Cache des erreurs upstream
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # ----------------------------------------------
    # Assets statiques Next.js (_next/static)
    # ----------------------------------------------
    # 📚 CDA : Cache agressif pour les assets avec hash immutable
    # expires max = cache de 1 an (assets versionnés)

    location /_next/static/ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Cache agressif (assets immutables avec hash)
        expires max;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------
    # Images Next.js (_next/image)
    # ----------------------------------------------
    # 📚 CDA : Optimisation et cache des images servies par Next.js Image

    location /_next/image {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        # Cache des images optimisées
        expires 7d;
        add_header Cache-Control "public";
    }

    # ----------------------------------------------
    # Favicon et assets publics
    # ----------------------------------------------
    # 📚 CDA : Cache modéré pour favicon et assets du dossier /public

    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
}

# ==============================================
# INSTRUCTIONS D'INSTALLATION
# ==============================================
#
# 1. Copier ce fichier sur le VPS :
#    scp nginx/smartplanning.conf root@<VPS_IP>:/etc/nginx/sites-available/
#
# 2. Créer un lien symbolique pour l'activer :
#    ln -s /etc/nginx/sites-available/smartplanning.conf /etc/nginx/sites-enabled/
#
# 3. Supprimer la config par défaut si elle existe :
#    rm /etc/nginx/sites-enabled/default
#
# 4. Tester la configuration Nginx :
#    nginx -t
#
# 5. Installer certbot et obtenir un certificat SSL :
#    apt install certbot python3-certbot-nginx -y
#    certbot --nginx -d smartplanning.fr -d www.smartplanning.fr
#
# 6. Recharger Nginx :
#    systemctl reload nginx
#
# 7. Vérifier que l'application est accessible :
#    curl https://smartplanning.fr/api/health
#
# ==============================================
