# ==============================================
# NGINX - REVERSE PROXY UMAMI ANALYTICS
# ==============================================
# Configuration pour SmartPlanning (SP-345)
#
# INSTALLATION SUR VPS :
# ----------------------
# 1. Copier ce fichier dans /etc/nginx/snippets/umami.conf
# 2. Inclure dans le vhost smartplanning.fr :
#    include snippets/umami.conf;
# 3. Tester : sudo nginx -t
# 4. Recharger : sudo systemctl reload nginx
#
# ==============================================

# ----------------------------------------------
# DASHBOARD UMAMI (/analytics)
# ----------------------------------------------
# Interface d'administration Umami
# Authentification requise (admin panel)
# ----------------------------------------------
location /analytics {
    # Proxy vers le container Umami (port 3001)
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    # Headers pour identifier le client réel
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Support WebSocket (pour le dashboard real-time)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts adaptés
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Désactive le buffering pour le streaming
    proxy_buffering off;
}

# ----------------------------------------------
# SCRIPT DE TRACKING (/analytics/script.js)
# ----------------------------------------------
# Script léger (~1KB) chargé sur les pages
# Cache agressif car rarement modifié
# ----------------------------------------------
location = /analytics/script.js {
    proxy_pass http://127.0.0.1:3001/script.js;
    proxy_http_version 1.1;

    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache agressif (1 jour) - le script change rarement
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, max-age=86400, immutable";

    # Compression
    gzip on;
    gzip_types application/javascript;
}

# ----------------------------------------------
# API DE COLLECTE (/analytics/api/send)
# ----------------------------------------------
# Endpoint qui reçoit les events de tracking
# Doit être rapide et léger
# ----------------------------------------------
location = /analytics/api/send {
    proxy_pass http://127.0.0.1:3001/api/send;
    proxy_http_version 1.1;

    # Headers pour la géolocalisation
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pas de buffering pour les requêtes de tracking
    proxy_buffering off;

    # Timeout court (tracking doit être rapide)
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
}

# ----------------------------------------------
# ASSETS STATIQUES UMAMI
# ----------------------------------------------
# CSS, JS, images du dashboard
# ----------------------------------------------
location /analytics/_next/static {
    proxy_pass http://127.0.0.1:3001/_next/static;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Cache longue durée pour les assets buildés
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
}
